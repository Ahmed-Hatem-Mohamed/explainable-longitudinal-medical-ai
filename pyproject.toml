[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nacc-progression"
version = "0.1.0"
description = "Longitudinal multimodal NACC progression modeling and evaluation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "ml"}

[tool.setuptools.packages.find]
where = ["ml"]
include = ["nacc_progression*"]

[tool.pytest.ini_options]
pythonpath = ["ml"]
testpaths = ["tests"]